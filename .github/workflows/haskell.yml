name: Haskell CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions: {}

jobs:
  build:
    name: "GHC ${{ matrix.ghc }}${{ matrix.llvm && ' (LLVM)' || '' }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        ghc: ['9.10', '9.12', '9.14']
        os: [ubuntu-latest, macos-latest]
        llvm: [false, true]
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Use the distribution's default LLVM (Ubuntu 26.04: LLVM 21, Homebrew:
      # latest) like the Nix workflow does. It is newer than what GHC officially
      # supports (9.10: <=15, 9.12: <=19, 9.14: <=20), so GHC prints an
      # "unsupported version of LLVM" warning, but code generation still works.
      - name: Install LLVM (Linux)
        if: matrix.llvm && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm

      - name: Install LLVM (macOS)
        if: matrix.llvm && runner.os == 'macOS'
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Setup Haskell
        uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: 'latest'

      - name: Cache cabal store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal') }}
          restore-keys: ${{ runner.os }}-ghc-${{ matrix.ghc }}-

      - name: Install dependencies
        run: cabal build --dependencies-only --enable-tests --enable-benchmarks all

      - name: Build
        run: cabal build all --enable-tests --enable-benchmarks ${{ matrix.llvm && '-fllvm' || '' }}

      - name: Test
        run: cabal test ${{ matrix.llvm && '-fllvm' || '' }}

  format:
    name: Fourmolu
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Fourmolu
        uses: haskell-actions/run-fourmolu@1b9df64b784203126500372730b9725c97e4040b # v13
        with:
          pattern: |
            lib/**/*.hs
            test/**/*.hs
            bench/**/*.hs

  cabal-fmt:
    name: cabal-fmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Haskell
        uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        id: setup-cabal-fmt
        with:
          # cabal-fmt does not build with GHC >= 9.10 yet (base < 4.20)
          ghc-version: '9.8'
          cabal-version: 'latest'

      - name: Cache cabal-fmt
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup-cabal-fmt.outputs.cabal-store }}
          key: ${{ runner.os }}-cabal-fmt-${{ hashFiles('**/*.cabal') }}
          restore-keys: ${{ runner.os }}-cabal-fmt-

      - name: Install cabal-fmt
        run: cabal install cabal-fmt --ignore-project

      - name: Check cabal formatting
        run: |
          cabal-fmt -c musig2.cabal || {
            echo "::error::cabal file is not formatted. Run 'cabal-fmt -i musig2.cabal'"
            exit 1
          }

  lint:
    name: HLint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup HLint
        uses: haskell-actions/hlint-setup@fe9cd1cd1af94a23900c06738e73f6ddb092966a # v2.4.10

      - name: Run HLint
        uses: haskell-actions/hlint-run@eaca4cfbf4a69f4eb875df38b6bc3e1657020378 # v2.4.10
        with:
          path: '["lib/", "test/", "bench/"]'
          fail-on: warning
